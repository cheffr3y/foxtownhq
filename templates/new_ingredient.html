{% extends "base.html" %}

{% block title %}New Ingredient - Foxtown HQ{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50">
    <!-- Top Navigation Bar -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <a href="{{ url_for('ingredients') }}" class="text-foxtown-orange hover:text-orange-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                    </a>
                    <h1 class="text-2xl font-bold text-foxtown-dark">New Ingredient</h1>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="bg-white rounded-lg shadow p-6">
            <form method="POST" class="space-y-6">
                
                <!-- Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Ingredient Name *
                    </label>
                    <input 
                        type="text" 
                        name="name" 
                        value="{{ ingredient.name }}"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-foxtown-orange focus:border-transparent outline-none"
                    >
                </div>

                <!-- Category and Unit -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Category
                        </label>
                        <select 
                            name="category"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-foxtown-orange focus:border-transparent outline-none"
                        >
                            <option value="">Select category...</option>
                            {% set categories = ['Protein', 'Produce', 'Dairy', 'Dry Goods', 'Frozen', 'Bread', 'Condiments', 'Other'] %}
                            {% for cat in categories %}
                                <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Unit of Measure
                        </label>
                        <input 
                            type="text" 
                            name="unit" 
                            value="{{ ingredient.unit or '' }}"
                            placeholder="oz, lb, each, fl oz..."
                            list="unitOptions"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-foxtown-orange focus:border-transparent outline-none"
                        >
                    </div>
                </div>

                <!-- Vendor Info -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Vendor
                        </label>
                        <input 
                            type="text" 
                            name="vendor" 
                            value="{{ ingredient.vendor or '' }}"
                            placeholder="Sysco, US Foods, etc."
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-foxtown-orange focus:border-transparent outline-none"
                        >
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Vendor Code/SKU
                        </label>
                        <input 
                            type="text" 
                            name="vendor_code" 
                            value="{{ ingredient.vendor_code or '' }}"
                            placeholder="Vendor SKU"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-foxtown-orange focus:border-transparent outline-none"
                        >
                    </div>
                </div>

                <!-- G-Code and Cost -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            G-Code (Acumatica)
                        </label>
                        <input 
                            type="text" 
                            name="g_code" 
                            value="{{ ingredient.g_code or '' }}"
                            placeholder="G-CODE-123"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-foxtown-orange focus:border-transparent outline-none font-mono"
                        >
                        <p class="text-xs text-gray-500 mt-1">For Acumatica ERP integration</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Cost per Unit ($)
                        </label>
                        <input 
                            type="number" 
                            name="cost_per_unit" 
                            value="{{ ingredient.cost_per_unit or '' }}"
                            step="0.00001"
                            min="0"
                            placeholder="0.00000"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-foxtown-orange focus:border-transparent outline-none"
                        >
                        <p class="text-xs text-gray-500 mt-1">
                            If provided, this sets the price update date to today
                        </p>
                    </div>
                </div>

                <!-- Save Button -->
                <div class="flex justify-end space-x-3 pt-4">
                    <a href="{{ url_for('ingredients') }}" 
                       class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium transition">
                        Cancel
                    </a>
                    <button 
                        type="submit"
                        class="px-6 py-2 bg-foxtown-orange hover:bg-orange-600 text-white rounded-lg font-medium transition shadow hover:shadow-lg">
                        Create Ingredient
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>

<datalist id="unitOptions">
    <option value="fl oz"></option>
    <option value="oz"></option>
    <option value="each"></option>
    <option value="ea"></option>
</datalist>
{% endblock %}
