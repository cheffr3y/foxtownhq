<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Foxtown HQ{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'foxtown': {
                            'orange': '#F97316',
                            'blue': '#0EA5E9',
                            'slate': '#475569',
                            'dark': '#1E293B',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    {% block content %}{% endblock %}
</body>
</html>
